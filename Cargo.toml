[workspace]
resolver = "3"
members = ["crates/isothrum-core", "crates/isothrum-wasm"]
# The desktop app is its own workspace: it needs GTK/WebKit, which the engine does not.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
# Pinned to an Isoloom commit; for local work on both, add a [patch] to ../isoloom.
isoloom-core = { git = "https://github.com/isoloom/isoloom", rev = "bd87d009a62d71590cf2458270a52658b9325173" }
isothrum-core = { path = "crates/isothrum-core" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"

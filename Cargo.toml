[workspace]
resolver = "3"
members = ["crates/isothrum-core", "crates/isothrum-wasm"]
# The desktop app is its own workspace: it needs GTK/WebKit, which the engine does not.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
# Pinned to an Isoloom commit (its v1 work on main); for local work on both, add a [patch]
# to ../isoloom.
isoloom-spec = { git = "https://github.com/isoloom/isoloom", rev = "0111b26ec9d83b3f8002540be8650a7f393cd061" }
isoloom-targets = { git = "https://github.com/isoloom/isoloom", rev = "0111b26ec9d83b3f8002540be8650a7f393cd061" }
isothrum-core = { path = "crates/isothrum-core" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"

# The browser downloads the engine: build it for size (wasm-pack builds with --release).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[package]
name = "isothrum-runner"
description = "The Isothrum runner: executes the run manifest Isoloom writes next to a target's files (lifecycle, state and locks, drivers, checks, events)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/isothrum-runner"
keywords = ["isothrum", "runner", "infrastructure", "lab"]
categories = ["virtualization", "development-tools"]
# The `fake` feature embeds the run-manifest fixtures (src/testing.rs), so tests/ stays in the
# package; only the local formatter config is dropped.
exclude = ["rustfmt.toml"]
publish = true

[features]
# The test doubles (scripted processes, a fixed clock, scripted host ports), for embedders' tests.
fake = []
# The pure cores the fuzz targets drive (placeholder filling, step planning): `fuzz/` only.
fuzzing = []

[dependencies]
flate2.workspace = true
isoloom-manifest.workspace = true
process-wrap.workspace = true
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

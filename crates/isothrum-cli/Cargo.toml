[package]
name = "isothrum-cli"
description = "isothrum: run what Isoloom generates (up, down, park, resume, status, check, events) from the command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/isothrum-cli"
keywords = ["isothrum", "cli", "runner", "lab", "infrastructure"]
categories = ["command-line-utilities", "virtualization"]
exclude = ["tests/", "rustfmt.toml"]
publish = true

[[bin]]
name = "isothrum"
path = "src/main.rs"

[dependencies]
clap.workspace = true
isothrum-runner.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
isothrum-runner = { workspace = true, features = ["fake"] }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# The toolchain every host builds Isothrum with (Isoloom's; rustup installs it on first use). The
# two extra targets are the gates' cross-platform clippy legs.
[toolchain]
channel = "1.99.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

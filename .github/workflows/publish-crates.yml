name: Publish crates

# Publishes the Isothrum library crates to crates.io with crates.io Trusted Publishing: the job
# mints a short-lived token over OIDC at run time (no long-lived secret is stored). Triggered by a
# release tag `vX.Y.Z` (the same tag the desktop installer build uses) or run by hand from the
# Actions tab. It publishes in dependency order and skips any crate whose version is already on
# crates.io, so re-running after a partial failure is safe.
#
# Setup (per crate, done once by the maintainer): add a Trusted Publisher on crates.io for the
# crate, pointing at repository `isoloom/isothrum`, this workflow file (`publish-crates.yml`) and
# the `crates-io` environment. A brand-new crate name must be created by one manual `cargo publish`
# first (trusted publishing cannot create a crate that does not exist). The Isoloom crates this
# release depends on must already be on crates.io at the requested version (publish isoloom first).
# See PUBLISHING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      # Required for crates.io Trusted Publishing (OIDC); no CARGO_REGISTRY_TOKEN secret is used.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Mints a short-lived crates.io token over OIDC and exports it for the publish step.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # Leaf crates first: each crate's dependencies are published before it.
          crates=(isothrum-compiler isothrum-runner isothrum-wasm isothrum-cli)
          version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name=="isothrum-compiler") | .version')"
          echo "Publishing Isothrum crates at version ${version}"
          for crate in "${crates[@]}"; do
            if curl -sf -A "isothrum-publish-workflow" \
                "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null; then
              echo "::notice::${crate} ${version} is already on crates.io, skipping"
              continue
            fi
            echo "::group::Publishing ${crate} ${version}"
            cargo publish -p "${crate}"
            echo "::endgroup::"
          done

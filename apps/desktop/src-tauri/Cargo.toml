[package]
name = "isothrum-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# Its own workspace: GTK/WebKit are needed here only.
[workspace]

[lib]
name = "isothrum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
isoloom-spec = { git = "https://github.com/isoloom/isoloom", rev = "0111b26ec9d83b3f8002540be8650a7f393cd061" }
isoloom-targets = { git = "https://github.com/isoloom/isoloom", rev = "0111b26ec9d83b3f8002540be8650a7f393cd061" }
tauri-plugin-updater = "2"

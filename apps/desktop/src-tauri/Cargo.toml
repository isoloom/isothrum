[package]
name = "isothrum-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# Its own workspace: GTK/WebKit are needed here only.
[workspace]

[lib]
name = "isothrum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
isoloom-core = { git = "https://github.com/isoloom/isoloom", rev = "164b40091b570e72868bf6a53c89038899a37639" }
tauri-plugin-updater = "2"
